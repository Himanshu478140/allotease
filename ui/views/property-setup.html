<div style="display:flex; flex-direction:column; gap:1.25rem;">

  <!-- TAB 1: PROPERTY FACTOR CONFIG & INTAKE SETUP -->
  <div id="prop-config-panel" style="display:flex; flex-direction:column; gap:1.5rem;">



    <!-- Integrated System Reports & CSV Data Exports Card -->
    <div style="background:var(--bg-main); border:none; border-radius:var(--radius-md); padding:1.25rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
      <div>
        <h4 style="font-family:'Outfit'; font-size:1.05rem; color:var(--accent-blue); margin:0;">Analytics & System Data Exports</h4>
        <p style="font-size:0.8rem; color:var(--text-secondary); margin-top:0.2rem; margin-bottom:0;">
          Export complete database records in CSV format for offline reporting and administrative audits.
        </p>
      </div>
      <div class="reports-export-bar" style="display:flex; gap:0.6rem; flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="downloadCSV('Students')" style="padding:0.45rem 0.85rem; font-size:0.8rem;">Export Students CSV</button>
        <button class="btn btn-secondary" onclick="downloadCSV('Rooms')" style="padding:0.45rem 0.85rem; font-size:0.8rem;">Export Rooms CSV</button>
        <button class="btn btn-secondary" onclick="downloadCSV('Allocations')" style="padding:0.45rem 0.85rem; font-size:0.8rem;">Export Allocations CSV</button>
      </div>
    </div>



    <!-- Action Bar -->
    <div style="display:flex; justify-content:flex-end;">
      <button class="btn btn-primary" id="btn-save-property-config" onclick="savePropertyConfigFromUI()"
        style="min-width:200px;">
        <span>Save Configuration</span>
      </button>
    </div>

  </div>



</div>
