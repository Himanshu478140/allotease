<!-- VIEW 3: STUDENTS DATABASE -->
<div class="table-card" style="padding:1.5rem;">
  
  <!-- Header & Search Bar -->
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom:1.25rem; border-bottom:1px solid var(--border-color); padding-bottom:0.75rem;">
    <div>
      <h3 style="font-family:var(--font-heading); color:var(--text-primary); font-size:1.45rem; font-weight:700; margin:0;">
        Student Records Directory
      </h3>
      <p style="font-size:0.92rem; color:var(--text-secondary); margin-top:0.35rem; margin-bottom:0;">
        Browse and manage all registered hostel student applicants and profile data.
      </p>
    </div>

    <div class="search-filter-box" style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap;">
      <input type="text" class="input-field" id="search-students" placeholder="Search students or ID...">
      <button class="btn btn-secondary" onclick="downloadCSV('Students')" style="padding:0.45rem 0.85rem; font-size:0.82rem; white-space:nowrap; display:inline-flex; align-items:center; gap:0.4rem;">
        <svg viewBox="0 0 24 24" style="width:14px; height:14px; stroke:currentColor; stroke-width:2; fill:none;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span>Export Students CSV</span>
      </button>
    </div>
  </div>

  <!-- Students Table -->
  <div id="students-table-container" class="table-responsive">
    <table>
      <thead id="students-thead">
        <!-- Dynamically populated based on active form configuration -->
      </thead>
      <tbody id="students-tbody"></tbody>
    </table>
  </div>

  <!-- Students Pagination Bar -->
  <div id="students-pagination-container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; margin-top:1.25rem; padding-top:0.85rem; border-top:1px solid var(--border-color);"></div>

</div>
