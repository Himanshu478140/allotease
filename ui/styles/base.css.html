<style>
  /* Base System Styles - Sahara Design System (EB Garamond & Manrope) */
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Manrope:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg-main: #FBF8F3;
    /* Sahara Light Canvas Background */
    --bg-card: #FFFFFF;
    /* Clean elevated white surface card */
    --bg-card-hover: #F7F2EC;
    /* Soft warm hover */
    --bg-hover: #F2EBE2;
    /* Warm taupe hover */
    --border-color: #E8DFD5;
    /* Soft light beige border */
    --border-focus: #C2652A;
    /* Primary Sahara Orange focus ring */

    --accent-primary: #C2652A;
    /* Primary: #C2652A */
    --accent-blue: #C2652A;
    /* Primary: #C2652A */
    --accent-blue-hover: #A6521F;
    /* Deep Terracotta Hover */
    --accent-secondary: #78706A;
    /* Secondary: #78706A */
    --accent-tertiary: #8C3C3C;
    /* Tertiary: #8C3C3C */
    --accent-emerald: #4A7C59;
    /* Warm Forest Green */
    --accent-amber: #C2652A;
    /* Primary Sahara */
    --accent-rose: #8C3C3C;
    /* Tertiary Rust Red */
    --accent-purple: #8C3C3C;
    /* Tertiary Rust Red */

    --text-primary: #605850;
    /* Neutral: #605850 */
    --text-secondary: #78706A;
    /* Secondary: #78706A */
    --text-muted: #9E948A;
    /* Muted neutral taupe */

    --font-heading: 'EB Garamond', serif;
    --font-body: 'Manrope', sans-serif;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;

    --shadow-soft: 0 10px 25px -5px rgba(194, 101, 42, 0.08), 0 8px 10px -6px rgba(96, 88, 80, 0.04);
    --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-body);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6,
  .page-title,
  .brand-title {
    font-family: var(--font-heading);
  }

  /* Custom High-Visibility Theme-Integrated Scrollbars (AGENTS.md Rule 2) */
  ::-webkit-scrollbar {
    width: 9px;
    height: 9px;
  }

  ::-webkit-scrollbar-track {
    background: rgba(61, 53, 46, 0.05);
    border-radius: 999px;
  }

  ::-webkit-scrollbar-thumb {
    background: #A89584;
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: #C2652A;
    border: 2px solid transparent;
    background-clip: padding-box;
  }

  .scrollbar-thin::-webkit-scrollbar {
    width: 7px;
    height: 7px;
  }

  .scrollbar-thin::-webkit-scrollbar-track {
    background: rgba(61, 53, 46, 0.07);
    border-radius: 999px;
  }

  .scrollbar-thin::-webkit-scrollbar-thumb {
    background: #9A8775;
    border-radius: 999px;
  }

  .scrollbar-thin::-webkit-scrollbar-thumb:hover {
    background: #C2652A;
  }

  body {
    background-color: var(--bg-main);
    background-image: radial-gradient(120% 750px at 50% -60px, rgba(224, 110, 32, 0.30) 0%, rgba(194, 101, 42, 0.18) 40%, rgba(247, 242, 236, 0.5) 70%, transparent 100%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    line-height: 1.5;
  }

  /* Mobile Header (Hidden on Desktop) */
  .mobile-header {
    display: none;
    height: 60px;
    background: #f1f5f9;
    border-bottom: 1px solid var(--border-color);
    padding: 0 1rem;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 90;
  }

  .mobile-toggle-btn {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    font-size: 1.25rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition-fast);
  }

  .mobile-toggle-btn:hover {
    background: var(--bg-hover);
    border-color: var(--accent-blue);
  }

  .mobile-brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .sidebar-close-btn {
    display: none;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0.25rem;
    margin-left: auto;
  }

  .sidebar-backdrop {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(4px);
    z-index: 95;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .sidebar-backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* Top Navigation Header Bar */
  .top-nav-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: transparent !important;
    border-bottom: none !important;
    z-index: 1000;
    display: flex;
    align-items: center;
  }

  .nav-container {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  /* Brand Logo (Far Left) */
  .brand-brand-group {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 42px;
    width: 42px;
    padding: 4px;
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid rgba(194, 101, 42, 0.18);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    flex-shrink: 0;
    cursor: default;
    transition: var(--transition-fast);
  }

  .brand-logo {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 8px;
  }

  .brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
  }

  .brand-title {
    font-family: 'EB Garamond', serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent-blue);
    line-height: 1;
  }

  .brand-subtitle {
    font-family: var(--font-body);
    font-size: 0.58rem;
    font-weight: 500;
    color: #78706A;
    opacity: 0.8;
    letter-spacing: 0.2px;
    line-height: 1;
    margin-top: -1px;
    white-space: nowrap;
  }

  /* Centered Dark Navigation Pill Capsule Container (Like Finnova Reference Image!) */
  .main-nav-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }

  .top-nav-bar .nav-menu {
    position: relative !important;
    display: inline-flex !important;
    flex-direction: row !important;
    align-items: stretch !important;
    flex-wrap: nowrap !important;
    width: auto !important;
    max-width: fit-content !important;
    gap: 0.25rem !important;
    list-style: none;
    margin: 0;
    padding: 3px 4px;
    background: #3D352E;
    border-radius: 999px;
    box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.35), 0 4px 14px rgba(61, 53, 46, 0.18);
    height: 46px;
    flex-shrink: 0;
  }

  .nav-active-pill-indicator {
    position: absolute;
    top: 0;
    left: 0;
    background: #C2652A;
    border-radius: 999px;
    box-shadow: 0 2px 10px rgba(194, 101, 42, 0.45);
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    visibility: hidden;
    will-change: transform, width;
  }

  .nav-active-pill-indicator.initialized {
    visibility: visible;
    opacity: 1;
    transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), width 0.35s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .top-nav-bar .nav-item {
    position: relative;
    z-index: 2;
    display: inline-flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: center !important;
    width: auto !important;
    max-width: none !important;
    flex: 0 0 auto !important;
    gap: 0.35rem;
    padding: 0 1.1rem !important;
    border-radius: 999px;
    border: none !important;
    border-left: none !important;
    color: #D9CEBF;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap !important;
    background: transparent !important;
    box-shadow: none !important;
    transition: color 0.25s ease;
    user-select: none;
    height: 100%;
    outline: none;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-text {
    display: inline-block;
    white-space: nowrap;
    opacity: 1;
    font-size: 0.85rem;
    line-height: 1;
  }

  .top-nav-bar .nav-item:hover:not(.active) {
    color: #FFFFFF !important;
    background: transparent !important;
    border: none !important;
    border-left: none !important;
  }

  .top-nav-bar .nav-item:active {
    background: transparent !important;
    border: none !important;
    border-left: none !important;
  }

  .top-nav-bar .nav-item.active {
    background: transparent !important;
    color: #FFFFFF !important;
    font-weight: 600 !important;
    box-shadow: none !important;
    border: none !important;
    border-left: none !important;
    width: auto !important;
    flex: 0 0 auto !important;
  }

  #view-dashboard,
  #view-intake-form,
  #view-students,
  #view-rooms,
  #view-allocation,
  #view-property-setup,
  .tab-fade-in,
  .panel-fade-in {
    animation: tabFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes tabFadeIn {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }

  .nav-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav-icon svg {
    width: 15px;
    height: 15px;
    stroke: #D9CEBF;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .nav-item:hover .nav-icon svg,
  .nav-item.active .nav-icon svg {
    stroke: #FFFFFF;
  }

  /* Right Header Action Icons */
  .header-right-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  .icon-btn-action {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-primary) !important;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .icon-btn-action:hover {
    background: var(--bg-card-hover);
    color: var(--accent-blue) !important;
    border-color: var(--accent-blue);
  }

  .icon-btn-action.active {
    background: #C2652A !important;
    color: #FFFFFF !important;
    border-color: #C2652A !important;
  }

  .user-profile-badge {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.25rem 0.75rem 0.25rem 0.25rem;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-primary);
  }

  .user-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #C2652A;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.55rem 0.85rem;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition-fast);
  }

  .nav-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .nav-item.active {
    background: linear-gradient(90deg, rgba(56, 189, 248, 0.15), rgba(56, 189, 248, 0.02));
    color: var(--accent-blue);
    border-left: 3px solid var(--accent-blue);
    font-weight: 600;
  }

  .nav-icon {
    font-size: 1rem;
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 0.75rem;
    border-top: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex-shrink: 0;
  }

  .sidebar-footer .btn {
    min-height: 36px;
    padding: 0.45rem 0.85rem;
    font-size: 0.8rem;
  }

  /* Main Layout */
  #main-content {
    margin-left: 260px;
    flex: 1;
    padding: 2rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    max-width: calc(100vw - 260px);
    transition: var(--transition-smooth);
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 0.5rem;
    border-bottom: none;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .page-title {
    font-family: 'Outfit', 'EB Garamond', sans-serif;
    font-size: 3.6rem;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.8px;
    margin-bottom: 0;
  }

  .page-subtitle {
    font-size: 1.05rem;
    color: #78706A;
    opacity: 0.85;
    font-weight: 500;
    letter-spacing: 0.2px;
    margin-top: 4px;
    line-height: 1.2;
  }

  .action-group {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
  }

  /* Responsive Layout Breakpoints */
  @media (max-width: 1024px) {
    #sidebar {
      width: 220px;
    }

    #main-content {
      margin-left: 220px;
      max-width: calc(100vw - 220px);
      padding: 1.5rem;
    }
  }

  @media (max-width: 768px) {
    body {
      padding-top: 60px;
    }

    .mobile-header {
      display: flex;
    }

    .sidebar-backdrop {
      display: block;
    }

    .sidebar-close-btn {
      display: block;
    }

    #sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      z-index: 100;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
    }

    #sidebar.mobile-open {
      left: 0;
    }

    #main-content {
      margin-left: 0;
      max-width: 100vw;
      width: 100%;
      padding: 1rem;
      gap: 1.25rem;
    }

    .top-bar {
      flex-direction: column;
      align-items: stretch;
      gap: 0.85rem;
    }

    .action-group {
      width: 100%;
    }

    .page-title {
      font-size: 2.5rem;
    }
  }
</style>
