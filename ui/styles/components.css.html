<style>
  /* UI Components - Buttons, Cards, Modals, Tables, Badges, Custom Dropdowns, Toasts */

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.6rem 1.2rem;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    min-height: 40px;
    transition: background-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-blue-hover));
    color: #fff;
    box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
  }

  .btn-primary:hover {
    box-shadow: 0 6px 16px rgba(234, 88, 12, 0.4);
  }

  .btn-success {
    background: linear-gradient(135deg, var(--accent-emerald), #059669);
    color: #fff;
    box-shadow: 0 4px 12px rgba(52, 211, 153, 0.25);
  }

  .btn-success:hover {
    box-shadow: 0 6px 16px rgba(52, 211, 153, 0.35);
  }

  .btn-warning {
    background: linear-gradient(135deg, var(--accent-amber), #d97706);
    color: #0f172a;
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
  }

  .btn-secondary:hover {
    background: var(--bg-hover);
  }

  .btn-danger {
    background: linear-gradient(135deg, var(--accent-rose), #e11d48);
    color: #fff;
  }

  /* Zero-Transform Crisp Container Elevation (No Text Blur) */
  .table-card,
  .stat-card,
  .card,
  .panel-card,
  .sub-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-soft);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .table-card:hover,
  .stat-card:hover,
  .card:hover,
  .panel-card:hover,
  .sub-card:hover {
    box-shadow: 0 12px 30px -6px rgba(61, 53, 46, 0.14), 0 4px 10px -2px rgba(61, 53, 46, 0.06);
  }

  .table-header-bar {
    padding: 1rem 1.5rem;
    background: var(--bg-card-hover);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .search-filter-box {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 320px;
  }

  /* Data Tables & Horizontal Scrolling */
  .table-responsive {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 0.875rem;
    min-width: 650px;
  }

  th {
    background: var(--bg-card-hover);
    color: var(--text-secondary);
    font-weight: 600;
    padding: 0.85rem 1.25rem;
    border-bottom: 1px solid var(--border-color);
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  td {
    padding: 0.9rem 1.25rem;
    border-bottom: 1px solid var(--border-color);
    color: var(--text-primary);
    white-space: nowrap;
  }

  tr:hover td {
    background: var(--bg-card-hover);
  }

  /* Badges (Clean Plain Text Rendering - No Background Box/Border) */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-allocated,
  .badge-available {
    background: transparent !important;
    color: var(--accent-emerald, #16a34a) !important;
    border: none !important;
  }

  .badge-unallocated,
  .badge-waiting {
    background: transparent !important;
    color: var(--accent-amber, #d97706) !important;
    border: none !important;
  }

  .badge-full,
  .badge-maintenance {
    background: transparent !important;
    color: var(--accent-rose, #dc2626) !important;
    border: none !important;
  }

  .badge-priority {
    background: transparent !important;
    color: var(--accent-purple, #9333ea) !important;
    border: none !important;
  }

  /* Custom Dropdowns (AGENTS.md Rule 1.5) */
  .custom-select-wrapper {
    position: relative;
    width: 100%;
  }

  .custom-select-trigger {
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0.6rem 0.85rem;
    color: var(--text-primary);
    font-size: 0.875rem;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: var(--transition-fast);
  }

  .custom-select-trigger:hover,
  .custom-select-trigger.active {
    border-color: var(--accent-blue);
  }

  .custom-select-dropdown {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-soft);
    z-index: 500;
    max-height: 200px;
    overflow-y: auto;
    display: none;
    flex-direction: column;
  }

  .custom-select-dropdown.active {
    display: flex;
  }

  .custom-select-option {
    padding: 0.6rem 0.85rem;
    font-size: 0.85rem;
    color: var(--text-secondary);
    cursor: pointer;
    transition: var(--transition-fast);
  }

  .custom-select-option:hover,
  .custom-select-option.selected {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  /* Modals */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: var(--transition-fast);
    padding: 1rem;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.75rem;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    transform: translateY(20px);
    transition: var(--transition-fast);
  }

  .modal-overlay.active .modal-card {
    transform: translateY(0);
  }

  .modal-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
  }

  /* Toasts */
  .toast-container {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    z-index: 2000;
    max-width: 90vw;
  }

  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--accent-blue);
    padding: 0.85rem 1.25rem;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 0.875rem;
    box-shadow: var(--shadow-soft);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes slideIn {
    from {
      transform: translateX(100%);
      opacity: 0;
    }

    to {
      transform: translateX(0);
      opacity: 1;
    }
  }

  @media (max-width: 768px) {
    .action-group .btn {
      width: 100%;
    }

    .toast-container {
      left: 1rem;
      right: 1rem;
      bottom: 1rem;
    }
  }

  /* Custom Actions Popover Menu (AGENTS.md Rule 1.5) */
  .action-dropdown-menu {
    display: none;
    position: fixed;
    z-index: 99999;
    width: max-content;
    min-width: 155px;
    max-width: 175px;
    box-sizing: border-box;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-md);
    box-shadow: 0 10px 30px rgba(61, 53, 46, 0.22);
    padding: 0.35rem;
  }

  .action-dropdown-menu .dropdown-item {
    width: 100%;
    text-align: left;
    padding: 0.45rem 0.65rem;
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 0.82rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .action-dropdown-menu .dropdown-item:hover {
    background: var(--bg-hover, rgba(61, 53, 46, 0.06));
  }

  .action-dropdown-menu .dropdown-item.danger:hover {
    background: rgba(239, 68, 68, 0.08);
  }

  .action-dots-btn:hover {
    color: var(--primary, #C2652A) !important;
  }

  @media (max-width: 480px) {
    .modal-card {
      padding: 1.25rem;
    }
  }
</style>
